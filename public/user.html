<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Picture · Screen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" class="stage">
    <a class="badge btn ghost" href="host.html">🎛️ Host</a>
    <div class="paused-tag">⏸ PAUSED</div>

    <div id="idle">
      <div class="brand" style="justify-content:center">
        <div class="logo">🚗</div>
        <h1 style="margin:0">Guest Picture</h1>
      </div>
      <p class="idle-hint">รอ Host เริ่มเกม… 🎬</p>
      <p class="muted" id="idleStat"></p>
    </div>

    <div id="countdown" class="hidden">
      <div class="count-label">Get Ready</div>
      <div class="count-big" id="countNum">5</div>
    </div>

    <div id="reveal" class="hidden">
      <img id="stageImg" class="stage-img" alt="">
      <div class="stage-q" id="stageQ"></div>
      <div class="stat"><span id="progress"></span></div>
    </div>
  </div>

  <div class="floatctrl">
    <button id="pauseBtn" class="btn amber" disabled>⏸ Pause</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app-user.js"></script>
</body>
</html>
