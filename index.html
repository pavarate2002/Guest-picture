<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Picture 🖼️</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Kanit', 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #14213d 0%, #05070f 65%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    overflow-x: hidden;
  }

  .card {
    position: relative;
    background: linear-gradient(160deg, rgba(10,15,30,0.95), rgba(5,8,18,0.98));
    border-radius: 22px;
    padding: 34px 30px 38px;
    width: 100%;
    max-width: 560px;
    text-align: center;
    border: 1px solid rgba(0, 229, 255, 0.35);
    box-shadow:
      0 0 25px rgba(0, 229, 255, 0.25),
      0 0 60px rgba(255, 0, 200, 0.12),
      inset 0 0 30px rgba(0, 229, 255, 0.05);
  }

  h1 {
    margin: 0 0 22px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 2.1em;
    letter-spacing: 2px;
    color: #fff;
    text-shadow:
      0 0 6px #00e5ff,
      0 0 14px #00e5ff,
      0 0 26px #00b8ff,
      0 0 46px #ff00c8;
    animation: flicker 3.5s infinite alternate;
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
      text-shadow:
        0 0 6px #00e5ff,
        0 0 14px #00e5ff,
        0 0 26px #00b8ff,
        0 0 46px #ff00c8;
    }
    20%, 24%, 55% {
      text-shadow: none;
      opacity: 0.55;
    }
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-bottom: 26px;
  }

  .btn {
    border: none;
    padding: 11px 22px;
    border-radius: 50px;
    font-family: 'Kanit', sans-serif;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    letter-spacing: 0.5px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    background: rgba(255,255,255,0.04);
    border: 1px solid transparent;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
  .btn:active { transform: translateY(0); }

  .btn-upload {
    border-color: #00e5ff;
    box-shadow: 0 0 10px rgba(0,229,255,0.6), inset 0 0 8px rgba(0,229,255,0.15);
    color: #00e5ff;
  }
  .btn-reset {
    border-color: #ff2e93;
    box-shadow: 0 0 10px rgba(255,46,147,0.6), inset 0 0 8px rgba(255,46,147,0.15);
    color: #ff2e93;
  }
  .btn-reveal {
    border-color: #39ff14;
    box-shadow: 0 0 10px rgba(57,255,20,0.6), inset 0 0 8px rgba(57,255,20,0.15);
    color: #39ff14;
  }
  input[type="file"] { display: none; }

  .board-wrapper {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    background: #05070f;
    border: 1px solid rgba(0, 229, 255, 0.4);
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.35),
      0 0 45px rgba(255, 0, 200, 0.15),
      inset 0 0 25px rgba(0,0,0,0.6);
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.35);
    font-size: 1em;
    padding: 20px;
    text-align: center;
    z-index: 3;
    text-shadow: 0 0 8px rgba(0,229,255,0.3);
  }

  .sharp-layer {
    position: absolute;
    inset: 0;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    z-index: 1;
  }

  .grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 0;
    z-index: 2;
  }

  .tile {
    background: linear-gradient(160deg, #0d1b3d, #050a1c);
    color: #00e5ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3em;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.4s ease, filter 0.2s ease;
    box-shadow:
      inset 0 0 0 1px rgba(0, 229, 255, 0.35),
      inset 0 0 12px rgba(0, 229, 255, 0.12);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
  }
  .tile:hover {
    filter: brightness(1.3);
    box-shadow:
      inset 0 0 0 1px rgba(0, 229, 255, 0.8),
      inset 0 0 20px rgba(0, 229, 255, 0.35);
  }
  .tile.revealed {
    opacity: 0;
    pointer-events: none;
  }

  .status {
    margin-top: 18px;
    color: #00e5ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9em;
    letter-spacing: 1px;
    min-height: 1.3em;
    text-shadow: 0 0 8px rgba(0,229,255,0.6);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🖼️ GUESS THE PICTURE</h1>

    <div class="controls">
      <label class="btn btn-upload" for="fileInput">📤 Upload Picture</label>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
      <button class="btn btn-reveal" id="revealAllBtn">👁️ Reveal All</button>
    </div>

    <div class="board-wrapper" id="boardWrapper">
      <div class="placeholder" id="placeholder">No picture yet<br>Click "Upload Picture" to start the game</div>
      <div class="sharp-layer" id="sharpLayer"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="status" id="status"></div>
  </div>

<script>
  const fileInput = document.getElementById('fileInput');
  const placeholder = document.getElementById('placeholder');
  const sharpLayer = document.getElementById('sharpLayer');
  const grid = document.getElementById('grid');
  const resetBtn = document.getElementById('resetBtn');
  const revealAllBtn = document.getElementById('revealAllBtn');
  const statusEl = document.getElementById('status');

  const TOTAL_TILES = 16;
  let tilesRevealed = 0;
  let currentImageUrl = null;

  function buildGrid() {
    grid.innerHTML = '';
    tilesRevealed = 0;
    for (let i = 0; i < TOTAL_TILES; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.index = i;
      tile.textContent = i + 1;
      tile.addEventListener('click', () => revealTile(tile));
      grid.appendChild(tile);
    }
    updateStatus();
  }

  function revealTile(tile) {
    if (tile.classList.contains('revealed')) return;
    tile.classList.add('revealed');
    tilesRevealed++;
    updateStatus();
  }

  function revealAll() {
    document.querySelectorAll('.tile').forEach(t => t.classList.add('revealed'));
    tilesRevealed = TOTAL_TILES;
    updateStatus();
  }

  function resetTiles() {
    if (!currentImageUrl) return;
    buildGrid();
  }

  function updateStatus() {
    if (grid.children.length === 0) {
      statusEl.textContent = '';
      return;
    }
    statusEl.textContent = `Revealed ${tilesRevealed} / ${TOTAL_TILES} tiles`;
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      currentImageUrl = evt.target.result;
      sharpLayer.style.backgroundImage = `url('${currentImageUrl}')`;
      placeholder.style.display = 'none';
      buildGrid();
    };
    reader.readAsDataURL(file);
  });

  resetBtn.addEventListener('click', resetTiles);
  revealAllBtn.addEventListener('click', revealAll);
</script>
</body>
</html>
