<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Picture</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Kanit', 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #14213d 0%, #05070f 65%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    overflow-x: hidden;
  }

  .card {
    position: relative;
    background: linear-gradient(160deg, rgba(10,15,30,0.95), rgba(5,8,18,0.98));
    border-radius: 22px;
    padding: 30px 30px 34px;
    width: 100%;
    max-width: 560px;
    text-align: center;
    border: 1px solid rgba(0, 229, 255, 0.35);
    box-shadow:
      0 0 25px rgba(0, 229, 255, 0.25),
      0 0 60px rgba(255, 0, 200, 0.12),
      inset 0 0 30px rgba(0, 229, 255, 0.05);
  }

  .host-link {
    position: absolute; top: 20px; right: 24px;
    font-family: 'Kanit', sans-serif; font-size: 12px; font-weight: 600;
    color: #6f89ab; text-decoration: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    padding: 6px 12px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .host-link:hover { color: #9fd6ff; border-color: rgba(0,229,255,0.4); background: rgba(0,229,255,0.08); }

  h1 {
    margin: 6px 0 10px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.9em;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 6px #00e5ff, 0 0 14px #00e5ff, 0 0 26px #00b8ff, 0 0 46px #ff00c8;
    animation: flicker 3.5s infinite alternate;
  }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
      text-shadow: 0 0 6px #00e5ff, 0 0 14px #00e5ff, 0 0 26px #00b8ff, 0 0 46px #ff00c8;
    }
    20%, 24%, 55% { text-shadow: none; opacity: 0.55; }
  }

  .question-box {
    background: rgba(255, 210, 63, 0.06);
    border: 1px solid rgba(255, 210, 63, 0.4);
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 20px;
    min-height: 1.4em;
    font-size: 1.05em;
    font-weight: 600;
    color: #ffd23f;
    text-shadow: 0 0 8px rgba(255,210,63,0.5);
  }

  .board-wrapper {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    background: #05070f;
    border: 1px solid rgba(0, 229, 255, 0.4);
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.35),
      0 0 45px rgba(255, 0, 200, 0.15),
      inset 0 0 25px rgba(0,0,0,0.6);
  }

  .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.35);
    font-size: 1em; padding: 20px; text-align: center;
    z-index: 3;
    text-shadow: 0 0 8px rgba(0,229,255,0.3);
  }

  .sharp-layer {
    position: absolute; inset: 0;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    z-index: 1;
  }

  .grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 0;
    z-index: 2;
  }

  .tile {
    background: linear-gradient(160deg, #0d1b3d, #050a1c);
    color: #00e5ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3em;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.4s ease, filter 0.2s ease;
    box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.35), inset 0 0 12px rgba(0, 229, 255, 0.12);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
  }
  .tile:hover { filter: brightness(1.3); box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.8), inset 0 0 20px rgba(0, 229, 255, 0.35); }
  .tile.revealed { opacity: 0; pointer-events: none; }

  .status {
    margin-top: 16px;
    color: #00e5ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85em;
    letter-spacing: 1px;
    min-height: 1.3em;
    text-shadow: 0 0 8px rgba(0,229,255,0.6);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }
  .btn {
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    font-family: 'Kanit', sans-serif;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    letter-spacing: 0.5px;
    transition: transform 0.18s ease, filter 0.18s ease;
    background: rgba(255,255,255,0.04);
    border: 1px solid transparent;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-start { border-color: #39ff14; box-shadow: 0 0 10px rgba(57,255,20,0.6), inset 0 0 8px rgba(57,255,20,0.15); color: #39ff14; }
  .btn-pause { border-color: #ffd23f; box-shadow: 0 0 10px rgba(255,210,63,0.6), inset 0 0 8px rgba(255,210,63,0.15); color: #ffd23f; }
  .btn-reveal { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.6), inset 0 0 8px rgba(0,229,255,0.15); color: #00e5ff; }
  .btn-reset { border-color: #ff2e93; box-shadow: 0 0 10px rgba(255,46,147,0.6), inset 0 0 8px rgba(255,46,147,0.15); color: #ff2e93; }

  .interval-field {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 16px;
    border-radius: 50px;
    color: #9fd6ff;
    font-size: 0.85em;
  }
  .interval-field input {
    width: 46px;
    background: #0a0f1e;
    border: 1px solid rgba(0,229,255,0.35);
    border-radius: 6px;
    color: #eaf6ff;
    text-align: center;
    font-family: 'Kanit', sans-serif;
    padding: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <a class="host-link" href="/host" title="Go to Host page">🔧 Host</a>
    <h1>🖼️ GUESS THE PICTURE</h1>
    <div class="question-box" id="questionBox">Waiting for the Host to send a picture...</div>

    <div class="board-wrapper" id="boardWrapper">
      <div class="placeholder" id="placeholder">No picture yet<br>Waiting for Host...</div>
      <div class="sharp-layer" id="sharpLayer"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="controls">
      <span class="interval-field">⏱ Every
        <input type="number" id="intervalInput" min="1" max="60" value="4">
        sec
      </span>
      <button class="btn btn-start" id="startBtn" disabled>▶ Start</button>
      <button class="btn btn-pause" id="pauseBtn" disabled>⏸ Pause</button>
      <button class="btn btn-reveal" id="revealAllBtn" disabled>👁️ Reveal All</button>
      <button class="btn btn-reset" id="resetBtn" disabled>🔄 Reset</button>
    </div>
  </div>

<script>
  const questionBox = document.getElementById('questionBox');
  const placeholder = document.getElementById('placeholder');
  const sharpLayer = document.getElementById('sharpLayer');
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const revealAllBtn = document.getElementById('revealAllBtn');
  const resetBtn = document.getElementById('resetBtn');
  const intervalInput = document.getElementById('intervalInput');

  const TOTAL_TILES = 16;
  let hasGame = false;
  let isPaused = false;
  let isRunning = false;

  function buildGrid() {
    grid.innerHTML = '';
    for (let i = 0; i < TOTAL_TILES; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.index = i;
      tile.textContent = i + 1;
      tile.addEventListener('click', () => {
        fetch('/api/user/reveal-tile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ index: i })
        });
      });
      grid.appendChild(tile);
    }
  }
  buildGrid();

  function applyRevealed(revealedList) {
    document.querySelectorAll('.tile').forEach((tile) => {
      const idx = Number(tile.dataset.index);
      if (revealedList.includes(idx)) {
        tile.classList.add('revealed');
      } else {
        tile.classList.remove('revealed');
      }
    });
  }

  function connectSSE() {
    const es = new EventSource('/events');
    es.addEventListener('game', (e) => {
      const data = JSON.parse(e.data);
      hasGame = true;
      questionBox.textContent = data.question ? data.question : '(No question set)';
      sharpLayer.style.backgroundImage = `url('${data.imageData}')`;
      placeholder.style.display = 'none';
      startBtn.disabled = false;
      revealAllBtn.disabled = false;
      resetBtn.disabled = false;
    });
    es.addEventListener('progress', (e) => {
      const data = JSON.parse(e.data);
      applyRevealed(data.revealed);
      isRunning = data.running;
      isPaused = data.paused;
      intervalInput.value = data.intervalSec;

      if (!hasGame) return;

      statusEl.textContent = `Revealed ${data.revealed.length} / ${data.total} tiles`;

      if (data.running && !data.paused) {
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        pauseBtn.textContent = '⏸ Pause';
      } else if (data.running && data.paused) {
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        pauseBtn.textContent = '▶ Resume';
      } else {
        startBtn.disabled = data.revealed.length >= data.total;
        pauseBtn.disabled = true;
        pauseBtn.textContent = '⏸ Pause';
      }
    });
  }
  connectSSE();

  startBtn.addEventListener('click', async () => {
    const intervalSec = Math.max(1, Math.min(60, Number(intervalInput.value) || 4));
    await fetch('/api/user/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ intervalSec })
    });
  });

  pauseBtn.addEventListener('click', async () => {
    if (isPaused) {
      await fetch('/api/user/resume', { method: 'POST' });
    } else {
      await fetch('/api/user/pause', { method: 'POST' });
    }
  });

  revealAllBtn.addEventListener('click', async () => {
    await fetch('/api/user/reveal-all', { method: 'POST' });
  });

  resetBtn.addEventListener('click', async () => {
    await fetch('/api/user/reset', { method: 'POST' });
  });
</script>
</body>
</html>
