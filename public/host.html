<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host · Guest Picture</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { --neon:#00e5ff; --neon2:#ff2bd6; --ok:#39ff88; --warn:#ffb020; --bad:#ff4d6d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Tahoma,sans-serif; background:#05060f; color:#e8ecff; padding:16px; }
  h1 { font-size:20px; margin-bottom:14px; color:#fff; letter-spacing:1px; }
  h1 span { color:var(--neon); }

  /* login */
  .login { max-width:340px; margin:16vh auto; text-align:center;
    background:#0b1030; border:1px solid #1c2350; border-radius:16px; padding:28px; }
  .login h2 { margin-bottom:14px; }
  input, textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #2a2f55;
    background:#0a0e26; color:#fff; font-size:15px; margin-bottom:10px; font-family:inherit;
  }
  input:focus, textarea:focus { outline:none; border-color:var(--neon); }
  .err { color:var(--bad); font-size:13px; min-height:18px; }

  .app { display:none; grid-template-columns:1fr 1fr; gap:16px; max-width:1100px; margin:0 auto; }
  @media(max-width:820px){ .app { grid-template-columns:1fr; } }

  .card { background:#0b1030; border:1px solid #1c2350; border-radius:16px; padding:16px; }
  .card h3 { font-size:15px; margin-bottom:12px; color:var(--neon); }

  label { font-size:12px; color:#8b93c9; display:block; margin-bottom:3px; }
  .flagrow { display:flex; align-items:center; gap:8px; }
  .flagrow .fg { font-size:20px; }

  button { cursor:pointer; border:none; border-radius:10px; padding:10px 14px;
    font-size:14px; font-weight:600; color:#05060f; transition:.15s; font-family:inherit; }
  button:hover { transform:translateY(-1px); }
  .btn-add { background:var(--neon); width:100%; }
  .btn-nav { background:#2a2f55; color:#fff; }
  .btn-count { background:var(--warn); }
  .btn-start { background:var(--ok); }
  .btn-pause { background:#7f8cff; }
  .btn-restart { background:#00c2b8; }
  .btn-rmatch { background:#5a63a0; color:#fff; }
  .btn-rall { background:var(--bad); }
  .btn-del { background:var(--bad); padding:5px 9px; font-size:12px; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .controls { display:flex; flex-direction:column; gap:10px; }
  .sep { height:1px; background:#1c2350; margin:6px 0; }

  .status { font-size:13px; color:#8b93c9; margin-bottom:10px; line-height:1.6; }
  .status b { color:#fff; }

  /* slide list */
  .slide-item { display:flex; align-items:center; gap:8px; padding:8px;
    border:1px solid #1c2350; border-radius:10px; margin-bottom:6px; }
  .slide-item.active { border-color:var(--neon); background:rgba(0,229,255,.06); }
  .slide-item img { width:52px; height:40px; object-fit:cover; border-radius:6px; background:#05060f; }
  .slide-item .meta { flex:1; font-size:12px; color:#b7bde8; overflow:hidden; }
  .slide-item .meta div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slide-item .go { background:#2a2f55; color:#fff; padding:5px 9px; font-size:12px; }

  .preview { text-align:center; }
  .preview img { max-width:100%; max-height:200px; border-radius:10px; border:1px solid #1c2350; }
  .preview .ph { padding:40px; color:#3a4170; font-size:48px; }
  .hint { font-size:11px; color:#5a63a0; margin-top:4px; }
  .filebtn { display:block; padding:10px; text-align:center; border:1px dashed #2a2f55;
    border-radius:10px; color:#8b93c9; cursor:pointer; margin-bottom:10px; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login" id="login">
    <h2>🔒 Host Login</h2>
    <input type="password" id="code" placeholder="ใส่รหัส Host" />
    <button class="btn-add" onclick="login()">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>
    <p style="font-size:12px;color:#5a63a0;margin-top:10px">
      <a href="/" style="color:#7f8cff">← กลับหน้า User</a>
    </p>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <!-- LEFT: add + list -->
    <div>
      <div class="card">
        <h3>➕ เพิ่มโจทย์ (รูป + คำถาม 3 ภาษา)</h3>
        <label class="filebtn" for="imgFile" id="fileLabel">📷 เลือกรูปภาพ</label>
        <input type="file" id="imgFile" accept="image/*" style="display:none" />
        <div class="flagrow"><span class="fg">🇹🇭</span><input id="q1" placeholder="คำถามภาษาไทย" /></div>
        <div class="flagrow"><span class="fg">🇺🇸</span><input id="q2" placeholder="Question (English)" /></div>
        <div class="flagrow"><span class="fg">🇯🇵</span><input id="q3" placeholder="質問 (日本語)" /></div>
        <button class="btn-add" onclick="addSlide()">เพิ่มลงเกม</button>
        <div class="hint">รูปจะยังไม่โชว์ให้ผู้เล่นจนกว่าจะกด Start</div>
      </div>

      <div class="card" style="margin-top:16px">
        <h3>🗂️ รายการโจทย์ทั้งหมด</h3>
        <div id="slideList"></div>
      </div>
    </div>

    <!-- RIGHT: controls -->
    <div>
      <div class="card">
        <h3>🎮 แผงควบคุมเกม</h3>
        <div class="status" id="status"></div>

        <div class="preview" id="preview"><div class="ph">?</div></div>
        <div class="sep"></div>

        <div class="controls">
          <div class="grid2">
            <button class="btn-nav" onclick="socket.emit('host:prev')">◀ ก่อนหน้า</button>
            <button class="btn-nav" onclick="socket.emit('host:next')">ถัดไป ▶</button>
          </div>

          <div class="grid2">
            <button class="btn-count" onclick="socket.emit('host:countdownStart', 5)">⏱️ Countdown Start (5)</button>
            <button class="btn-start" onclick="socket.emit('host:start')">▶ Start (เปิดรูป)</button>
          </div>

          <button class="btn-pause" onclick="socket.emit('host:pause')">⏸️ Pause / Resume</button>

          <div class="sep"></div>

          <button class="btn-restart" onclick="socket.emit('host:restartGame')">🔄 Restart Game (เริ่มใหม่ ทุกอย่างอยู่ครบ)</button>
          <div class="grid2">
            <button class="btn-rmatch" onclick="socket.emit('host:resetMatch')">↩️ Reset Match (เก็บรูป+คำถาม)</button>
            <button class="btn-rall" onclick="confirmResetAll()">🗑️ Reset All (ลบหมด)</button>
          </div>
        </div>
      </div>
      <p style="text-align:center;margin-top:12px"><a href="/" style="color:#7f8cff;font-size:13px">เปิดหน้า User (จอโชว์) →</a></p>
    </div>
  </div>

<script>
  const socket = io();
  let pendingImg = '';
  let curState = null;

  // ---- login ----
  function login() {
    const code = document.getElementById('code').value.trim();
    socket.emit('host:login', code, (res) => {
      if (res && res.ok) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'grid';
      } else {
        document.getElementById('loginErr').textContent = (res && res.msg) || 'เข้าสู่ระบบไม่สำเร็จ';
      }
    });
  }
  document.getElementById('code').addEventListener('keydown', e => { if (e.key==='Enter') login(); });

  // ---- image pick (compress to keep payload small) ----
  document.getElementById('imgFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const max = 1400;
        let { width:w, height:h } = img;
        if (w > max || h > max) { const r = Math.min(max/w, max/h); w*=r; h*=r; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        pendingImg = cv.toDataURL('image/jpeg', 0.85);
        document.getElementById('fileLabel').textContent = '✅ ' + file.name;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function addSlide() {
    const q1 = document.getElementById('q1').value.trim();
    const q2 = document.getElementById('q2').value.trim();
    const q3 = document.getElementById('q3').value.trim();
    if (!pendingImg && !q1 && !q2 && !q3) { alert('ใส่รูปหรือคำถามอย่างน้อย 1 อย่าง'); return; }
    socket.emit('host:addSlide', { img: pendingImg, q1, q2, q3 });
    // reset form
    pendingImg = '';
    document.getElementById('imgFile').value = '';
    document.getElementById('fileLabel').textContent = '📷 เลือกรูปภาพ';
    document.getElementById('q1').value = '';
    document.getElementById('q2').value = '';
    document.getElementById('q3').value = '';
  }

  function confirmResetAll() {
    if (confirm('ลบรูปและคำถามทั้งหมด? การกระทำนี้ย้อนกลับไม่ได้')) socket.emit('host:resetAll');
  }

  // ---- render ----
  socket.on('state', (s) => {
    curState = s;
    // status
    document.getElementById('status').innerHTML =
      'โจทย์: <b>' + (s.total ? (s.index+1) + ' / ' + s.total : '—') + '</b>' +
      ' · รูป: <b>' + (s.revealed ? 'เปิดแล้ว' : 'ปิดอยู่') + '</b>' +
      (s.countdown && s.countdown.running ? ' · ⏱️ กำลังนับ' + (s.countdown.paused ? ' (พัก)' : '') : '');

    // preview
    const pv = document.getElementById('preview');
    if (s.current && s.current.img) {
      pv.innerHTML = '<img src="'+s.current.img+'"/>' +
        '<div style="font-size:12px;color:#b7bde8;margin-top:6px;text-align:left">'+
        (s.current.q1?('🇹🇭 '+esc(s.current.q1)+'<br>'):'')+
        (s.current.q2?('🇺🇸 '+esc(s.current.q2)+'<br>'):'')+
        (s.current.q3?('🇯🇵 '+esc(s.current.q3)):'')+'</div>';
    } else if (s.current) {
      pv.innerHTML = '<div class="ph">?</div><div style="font-size:12px;color:#b7bde8;text-align:left">'+
        (s.current.q1?('🇹🇭 '+esc(s.current.q1)+'<br>'):'')+
        (s.current.q2?('🇺🇸 '+esc(s.current.q2)+'<br>'):'')+
        (s.current.q3?('🇯🇵 '+esc(s.current.q3)):'')+'</div>';
    } else {
      pv.innerHTML = '<div class="ph">?</div>';
    }

    // slide list
    const list = document.getElementById('slideList');
    if (!s.slides || !s.slides.length) { list.innerHTML = '<div style="color:#5a63a0;font-size:13px">ยังไม่มีโจทย์</div>'; return; }
    list.innerHTML = s.slides.map((sl, i) =>
      '<div class="slide-item '+(i===s.index?'active':'')+'">'+
        '<div class="meta"><div>#'+(i+1)+' '+(sl.hasImg?'🖼️':'—')+'</div>'+
        '<div>🇹🇭 '+esc(sl.q1||'-')+'</div></div>'+
        '<button class="go" onclick="socket.emit(\'host:goto\','+i+')">ไป</button>'+
        '<button class="btn-del" onclick="socket.emit(\'host:deleteSlide\','+i+')">ลบ</button>'+
      '</div>'
    ).join('');
  });

  function esc(t){ return (t||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
